# Netlify Configuration for Group ACH (https://www.achlinks.in/)
# Optimized for Vite + React SPA, Meta (Facebook) Crawler & Social Link Previews

[build]
  publish = "dist"
  command = "npm run build"

# 1. EXPLICIT PASS-THROUGH FOR CRITICAL CRAWLER FILES
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# 2. PREVENT SPA REWRITE FOR MISSING STATIC ASSETS & IMAGES
# Meta/Facebook crawlers flag sites as "broken" when missing image/asset URLs 
# return 200 with text/html (index.html). These rules force a clean 404 status.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.jpg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.jpeg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.png"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.ico"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.svg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.webp"
  to = "/404.html"
  status = 404

# 3. CANONICAL REDIRECT: non-www & double-www -> www (https://www.achlinks.in)
[[redirects]]
  from = "https://achlinks.in/*"
  to = "https://www.achlinks.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://achlinks.in/*"
  to = "https://www.achlinks.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.www.achlinks.in/*"
  to = "https://www.achlinks.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.www.achlinks.in/*"
  to = "https://www.achlinks.in/:splat"
  status = 301
  force = true

# 4. SPA ROUTING FALLBACK - MUST REMAIN THE LAST RULE
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
